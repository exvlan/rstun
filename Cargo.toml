[package]
name = "rstun"
description = "Standalone STUN/TURN server (RFC 5389 Binding with optional short/long-term authentication; RFC 5780 NAT behaviour discovery with `--alt-listen`; RFC 8656 relay with `--turn`: UDP/TCP, `turns:` (TLS) and DTLS behind the `tls`/`dtls` features; TURN REST credentials and per-allocation bandwidth quotas)."
homepage = "https://github.com/exvlan/rstun"
repository = "https://github.com/exvlan/rstun"
version = "26.410.107"
# 本 crate 是一个**独立项目**：没有 workspace、没有 path 依赖，
# `docker build .` 与 `cargo install --path .` 都能直接工作，
# 所以 edition / rust-version / 依赖版本都写实数。
edition = "2024"
rust-version = "1.95"
# **整仓 MPL-2.0**（`LICENSE`，官方全文逐字未改）。文件级 copyleft：改到本源文件
# 必须以 MPL-2.0 公开，但不要求更大的作品整体换证。详见 README 的 License 小节。
license = "MPL-2.0"
readme = "README.md"
keywords = ["stun", "rfc5389", "rfc5780", "nat", "networking"]
categories = ["network-programming"]
# 发布到 crates.io 时不带进包里：fuzz 目标是独立 workspace（nightly + libFuzzer），
# test/ 是实验室夹具（Go module / webrtc 客户端），tests/ 是单测夹具（含一次性 RSA
# 自签密钥对，见 tests/fixtures/README.md —— 会通过 `include_str!` 参与源码构建但
# 不希望进入 crate 包），CI 描述与源码无关。
exclude = ["fuzz/**", "test/**", "tests/**", ".github/**", ".opencode/**", ".trellis/**", "contrib/**", "script/**", "docs/**", ".cargo/**"]

[[bin]]
name = "rstun"
path = "src/main.rs"

# 两种发布构建（**默认 lean**）：
#   lean  `cargo build`                     STUN + TURN(UDP/TCP) + REST + 带宽，10 个直接依赖、~3.5 MB
#   full  `cargo build --features full`     再加 `turns:`(TLS) 与 DTLS，15 个直接依赖、~8.0 MB
# 数字是 unix 口径：`libc` 只在 unix 上是直接依赖（DONT-FRAGMENT 的 setsockopt），
# Windows 上没有它，lean/full 分别是 9/14。
# `dtls` 依赖 `tls`：两者共用同一份证书材料解析（`SecureMaterial`），DTLS 单独存在没有意义。
# 任何 feature 都不改变默认关闭路径的字节（`frozen` 项：3 配置 × 17 请求）。
[features]
default = []
tls = ["dep:tokio-rustls", "dep:rustls-pemfile", "dep:x509-parser"]
dtls = ["tls", "dep:webrtc-dtls", "dep:webrtc-util"]
full = ["tls", "dtls"]

[dependencies]
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
# `all` 为了 set_only_v6 / set_reuse_address / listen。
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  # `--max-inflight` uses `tokio::sync::Semaphore`; a feature, not a new crate.
  "sync",
  "time",
] }
tracing = "0.1"
# 只保留控制台输出：容器/systemd 采集 stdout 即可，不写滚动文件。
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
] }
# 鉴权（RFC 5389 §10 / RFC 8489 §9.2）**不手写密码学**：四个 RustCrypto 小 crate，
# 纯 Rust、无 C 依赖，版本固定在 digest 0.11 这一代（彼此 ABI 兼容）。
# 运行期依赖因此从 5 个变成 9 个 —— README「依赖面」与 CHANGELOG 都明写了这一点。
#
# `default-features = false`：md-5/sha1/sha2 0.11 一代的默认特性是 `alloc` + `oid`，
# 本仓只用「喂字节 → 取摘要」，不用 OID 常量也不需要 crate 侧分配 —— 关掉它们能把
# `const-oid` 挡在运行期依赖树之外，lean 的依赖树行数因此与 0.10 一代完全一致
# （89 行，见 README）。hmac 0.13 本身没有默认特性，这一行只是与同代保持一致。
# 算法与输出不受影响（RFC 2202/4231/1321/5769 向量照旧逐字节断言）。
hmac = { version = "0.13", default-features = false }
md-5 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }

# ---- TURN T2：`turns:`（TLS，RFC 8656 §5）与 DTLS 客户端传输（feature = tls / dtls）----
# 全部 optional：默认构建（lean）不编译、不链接、不引入它们的传递依赖。
# rustls 的 provider 固定为 ring（`default-features = false`）：webrtc-dtls 也用
# ring，两个 provider 同时编进来时 `CryptoProvider::get_default()` 会 panic。
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
rustls-pemfile = { version = "2.2", optional = true }
# 证书到期指标（`rstun_turn_tls_cert_expires_seconds`）需要读 X.509 validity，
# 而 rustls 的 `ServerConfig` 不回读 `notAfter`。`x509-parser` 本来就在
# 依赖树里（`webrtc-dtls` 的传递依赖），提升为直接依赖**不新增 crate**；仅
# `tls` feature 启用，lean 构建完全不受影响。只解析 DER（不做链验签），
# `default-features = false` 已无额外特性可关，显式写出来只为表明这一意图。
x509-parser = { version = "0.18", optional = true, default-features = false }
# `rustls` 不支持 DTLS；`webrtc-dtls` 是纯 Rust 实现（内置 rcgen/ring 的传递依赖）。
# `pem` 只用于把 PEM 证书/私钥读成 `Certificate`。
webrtc-dtls = { version = "0.12", optional = true, features = ["pem"] }
# `webrtc-dtls` 的监听/连接 API 以 `webrtc-util` 的 `Conn`/`Listener` trait 表达
# （`listen()` 返回 `impl Listener`，`accept()` 返回 `Arc<dyn Conn>`），调用这些
# 方法必须把 trait 带进作用域。它不是新增的传递依赖：webrtc-dtls 已依赖同一个
# crate（同版本、同 feature），这里只是把它变成直接依赖以便 `use`。
webrtc-util = { version = "0.11", optional = true, default-features = false, features = [
  "conn",
] }

# ---- DONT-FRAGMENT (0x001A)：relay socket 的 DF 位 ----
# `socket2 0.6` 没有 MTU-discover / DF 的 API，置位只能直接 `setsockopt`，所以要
# `libc`。**只在 unix 上**：Windows 不链接 libc，那里的 `DONT-FRAGMENT` 保持
# 「未知 comprehension-required → 420」（RFC 8656 §7.2 步骤 4 明文允许）。
# `libc` 本来就是传递依赖（tokio/socket2），这里只是提升为直接依赖，不新增 crate。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 参考实现 oracle（**只用于测试**，运行期依赖是上面的 10 个（unix）/ 9 个（Windows））：
# `stun-types` 是 STUN/TURN 生态里活跃维护的那一份（turn-types / WebRTC 侧的基础库），
# 用它交叉验证我们的编解码 —— 若它读不了我们的响应，第三方客户端也读不了。
stun-types = "2.0.5"
