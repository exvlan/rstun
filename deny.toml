# cargo-deny 配置（供应链门禁）
#
# CI 作业：`.github/workflows/ci.yml` 的 `deny` 作业跑
#   cargo deny check licenses bans sources
# （advisories 由同一作业里的 `cargo audit` 负责，见 `.cargo/audit.toml` ——
#  两处豁免清单必须一致，改一处要同步另一处。）
#
# 本地：`cargo deny check licenses bans sources`（无需 advisory 网络）。
# 工具版本固定在 CI 里（cargo-deny 0.22.0，prebuilt binary + sha256），不进 Cargo.toml。

[graph]
# 全平台都算：Windows 的 windows-sys 也要过 licenses/sources。
all-features = true

[advisories]
version = 2
# 与 `.cargo/audit.toml` 的 ignore 保持同一份（RUSTSEC-2026-0387 的处置写在那里）。
ignore = ["RUSTSEC-2026-0387"]
# unmaintained 类公告**不在 deny 里判**（`none` = 不检查这一族），口径交给 `cargo audit`：
# 它把 unmaintained 记为 warning、不影响退出码（bincode / pin-utils / rustls-pemfile 三条）。
# 若在 deny 里按 deny 处理，本地 `cargo deny check` 会与 CI 的 `cargo audit` 结论相反。
unmaintained = "none"

[licenses]
version = 2
# 允许清单 = 本仓实际依赖用到的 SPDX id（含 OR 表达式里出现的每一个选项）。
# **不**开 `allow-osi-fsf-free` 之类的笼统开关：新增许可证必须是一次显式决定。
allow = [
  "MPL-2.0",          # 本仓
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
]
# 0.9：cargo-deny 自己猜许可证时的置信度门槛。低于它就报错而不是猜。
confidence-threshold = 0.9
# 老式 `MIT/Apache-2.0`（斜杠写法）在树里还有几个 crate：cargo-deny 按 OR 解析，
# 两个选项都在 allow 里，所以不需要 clarify 条目（树里也没有 `license-file` 的 crate）。

[bans]
# 重复版本：**警告，不失败**。当前树里有 16 个同名多版本（digest 0.10/0.11、sha2 0.10/0.11、
# rand 0.8/0.10、windows-sys 0.52/0.61 …），绝大多数来自 dev-dependency `stun-types`
# 这一支（测试 oracle），运行期树是干净的。硬失败要写 16 条 skip 并随每次依赖升级维护，
# 收益低于成本 —— 真要收敛时按 `cargo tree -d` 逐个升级。
multiple-versions = "warn"
# 通配版本（`foo = "*"`）一律拒绝：版本不可复现。
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# 只允许 crates.io（本仓没有 git / path 依赖，`cargo metadata` 里 source 全是 registry）。
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
