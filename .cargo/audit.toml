# `cargo audit` 配置（项目级；本地 `cargo audit` 自动读取）。
#
# CI：`.github/workflows/ci.yml` 的 Linux `test` 作业直接跑 `cargo audit`（命令行版，
# 不用 rustsec/audit-check —— 那个 action 要 `checks: write`，只读 token 下会失败）。
# 命令行版**自动读本文件**，所以下面的 ignore 列表只有这一处真源；
# `deny.toml` 的 `[advisories].ignore` 是同一份清单的镜像（供手工 `cargo deny check` 用），
# 改一处要同步另一处。
#
# 原则：只豁免**有明确处置**的公告，其它漏洞继续让 `cargo audit` 失败。
# unmaintained 类公告（`bincode` / `pin-utils` / `rustls-pemfile`）只是 warning，
# 不影响退出码，这里不列 —— 列进来反而会掩盖「哪天它们变成漏洞」。

[advisories]
ignore = [
  # crypto-bigint 0.5.5：常量时间实现里的时序差异（RUSTSEC-2026-0387）。
  # 唯一可达路径是 DTLS：`--turn-dtls-listen` → webrtc-dtls → p256/p384 →
  # elliptic-curve 0.13 → crypto-bigint 0.5.x。上游修复版是 >=0.7.6，与
  # elliptic-curve 0.13 不兼容，只能等 webrtc-dtls / p256 升级。
  #
  # 豁免前提（任何一条不成立就必须重新评估）：
  #   1. 默认（lean）构建不包含该依赖：`cargo tree -e normal` 只有 9 个直接依赖；
  #   2. full 构建里只有显式给 `--turn-dtls-listen` 才执行到该代码；
  #   3. 每次发版前重跑 `cargo audit`，上游一旦有兼容版本立刻升级并删掉这条。
  "RUSTSEC-2026-0387",
]
