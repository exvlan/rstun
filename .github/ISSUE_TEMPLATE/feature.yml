name: 功能请求
description: 新的协议能力、部署形态、可观测性、打包渠道
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓的**范围**是「小规模的 STUN/TURN」：RFC 5389 Binding（可选 RFC 5780）+ 可选鉴权 +
        可选 RFC 8656 中继（UDP/TCP/`turns:`/DTLS、REST 凭据、带宽配额）。
        **不做**：TCP allocation（RFC 6062）、ACME/OCSP、租户/数据库/配置文件 ——
        需要这些时请用 coturn（差异见 [TURN 文档](https://exvlan.github.io/rstun/turn.html)）。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题（必填）
      description: 描述场景与现状的不足；不是「我想要 X 功能」，而是「我现在做不到 Y，因为 Z」。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 若有 RFC 依据（哪一节哪一条 MUST/SHOULD）、或参照实现（coturn 的哪个选项），请写明。

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你现在怎么绕过去的（配置、外包给 coturn、客户端改动）。

  - type: dropdown
    id: kind
    attributes:
      label: 类型（必填）
      options:
        - 协议行为（RFC 覆盖 / 状态码 / 属性）
        - 鉴权（短期 / 长期 / REST / SHA256 / USERHASH）
        - 限速 / 抗滥用 / 反射防护
        - TURN（UDP/TCP/turns:/DTLS/REST/带宽）
        - 可观测性（/metrics、/healthz、日志）
        - 打包 / 部署（.deb、brew、镜像、K8s）
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我确认这不是「有意不做」的项（见文首范围声明与 [TURN 文档](https://exvlan.github.io/rstun/turn.html)）
          required: true
        - label: 若改变默认路径的响应字节，我理解需要评估 `plain_response_bytes_are_frozen` 的兼容影响
          required: true
