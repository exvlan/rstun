name: Docs

# 文档站（mdBook）：只在 `main` 上构建并部署到 GitHub Pages。
#
# 为什么单独一个 workflow 而不是塞进 ci.yml：Pages 部署要 `pages: write` + `id-token: write`，
# 而 CI 的权限是只读（`contents: read`）—— 把写权限放进每次 push/PR 的流水线里没必要。
#
# 前置条件（**外部动作，需人工在仓库设置里点**）：Settings → Pages → Source = GitHub Actions。
# 未开启时 deploy 作业会失败，但不会影响仓库其它 CI。
on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      # changelog 页是 `{{#include ../../../CHANGELOG.md}}`：改 CHANGELOG 也要重建，
      # 否则 Pages 上的 Changelog 会停在旧版本。
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: mdbook build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # mdbook 用 prebuilt musl 二进制 + 校验 sha256（固定在 ci.yml/docs.yml 同一版本）。
      - name: Install mdbook (pinned prebuilt)
        run: |
          set -euo pipefail
          version=0.5.4
          sha256=5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
          tarball="/tmp/mdbook-${version}.tar.gz"
          curl -sSL --retry 3 -o "$tarball" \
            "https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-musl.tar.gz"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          mkdir -p /tmp/mdbook
          tar xzf "$tarball" -C /tmp/mdbook
          install -m 0755 /tmp/mdbook/mdbook /usr/local/bin/mdbook
          mdbook --version

      # `book.toml` 的 site-url 是 `/rstun/`（项目页），所以不需要额外改 base path。
      - name: mdbook build
        run: mdbook build docs/book

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book/book

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
