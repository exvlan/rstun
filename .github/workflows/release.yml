name: Release

# 手动发版（`workflow_dispatch`，不靠 tag 自动触发）。标准路径是
# `release-preflight`（只读预检）→ `release-prep`（bump + tag + dispatch 本 workflow）；
# 本 workflow 也可以手工 dispatch，作为逃生口：
#   · 传 `version`（**不带 `v`**，如 `26.410.100`）必须与 `Cargo.toml` 的 `version` 一致
#     —— 不一致直接失败，避免「tag 说 A、二进制说 B」；
#   · **`--ref` 不能省**：`sign` 默认 `true` 时 `prepare` 会断言 `GITHUB_REF == refs/tags/<tag>`
#     （keyless 证书身份绑在 ref 上；从 `main` 发版会写出「证书 @refs/heads/main + 说明写 tag」的
#     假声明，且 verify 必红）。要从分支发版只能显式 `-f sign=false`（说明会写「本版未签名」）；
#   · 一次 dispatch 交付三样：
#       Release `rstun-v<version>` + **八**个二进制资产（四个平台 × 两种构建）：
#         lean  `rstun-<platform>-<version>.zip`       STUN + TURN(UDP/TCP) + REST + 带宽
#         full  `rstun-full-<platform>-<version>.zip`  再加 `turns:`(TLS) 与 DTLS
#         另加 2 份 SBOM + `rstun.rb` + 2 个 deb = **13** 个核心资产；
#         签名时再加 `SHA256SUMS` + 3 个 `.bundle` = **17**（见下）
#       镜像 `ghcr.io/<owner>/rstun:<version>`（linux/amd64 + linux/arm64 双架构，**full** 构建）
#       crates.io `rstun <version>`（`publish-crates` 作业，与 `release` 并行、互不阻塞）
#   · 签名（keyless，`sign` 输入默认 `true`）：`SHA256SUMS`（覆盖 13 个核心资产）与两份 SBOM 各一份
#     cosign bundle；镜像由 `sign-image` 作业对 **manifest list digest** 签名（OCI 附件，不占资产位）。
#     keyless 需要 `id-token: write`；Fulcio/Rekor 不可达 → 作业失败（宁可发不出去，也不发「假已签名」）。
#     `sign=false` 仅作应急逃生口：不产生 sums/bundle，发布说明会明示「本版未签名」。
#   · 幂等：Release 已存在则 `gh release upload --clobber` 只覆盖资产；
#     镜像 tag 重复推即覆盖，manifest 用 `--amend` 重建；
#     crates.io 上已存在的版本由 `publish-crates.yml` 的 API 检查跳过（重跑不红）。
#
# 冒烟不可省（编译通过 ≠ 协议正确）：native 二进制与容器各验一次
# （`script/ci/rstun-smoke.sh` / `--version`）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          版本串（**不带 `v`**，如 26.410.100）。必须与 Cargo.toml 的 version 一致；
          同时用于 ghcr 镜像 tag、Release 名 `rstun-v<version>` 与资产名
          `rstun-<platform>-<version>.zip`（lean）/ `rstun-full-<platform>-<version>.zip`（full）
        type: string
        required: true
      sign:
        description: >-
          是否用 cosign keyless（GitHub OIDC + Sigstore Fulcio/Rekor）签名发布产物（默认 true）。
          传 false 只作应急逃生口：不产生 SHA256SUMS / .bundle，发布说明会明示「本版未签名」，
          post-release-verify 默认（require_signature=true）会判失败。
        type: boolean
        required: false
        default: true

# 默认最小权限；写权限按作业单独授予（Release 要 contents: write，推镜像要 packages: write）。
# 全部用 `GITHUB_TOKEN`，不新增 secret。
permissions:
  contents: read

concurrency:
  # 同一版本重复 dispatch 时排队而不是互相取消：发版中途被打断会留下半套资产。
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # 版本解析与校验：一处算好，全 run 共用（build 注入、资产命名、Release tag、镜像 tag）。
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      build_version: ${{ steps.v.outputs.build_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate version
        id: v
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="$(printf '%s' "${RAW:-}" | tr -d '[:space:]')"
          # 容错：误带 `v` 前缀也接受（版本串 / 资产名 / ghcr tag 统一不带 v）
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::版本串格式不合法：${version}（期望 YY.QMM.Mmpp[-<channel>.<n>]，如 26.410.100 或 26.410.100-dev.1）"
            exit 1
          fi

          # 版本只有一个真源：Cargo.toml。tag / 资产名 / 镜像 tag 都从它派生，
          # 所以这里必须与 dispatch 输入一致（不一致就停，不发半套东西）。
          manifest_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Cargo.toml 的 version 是 ${manifest_version}，与输入的 ${version} 不一致"
            exit 1
          fi

          sha6="$(git rev-parse --short=6 HEAD)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=${version}"
            echo "tag=rstun-v${version}"
            echo "build_version=${version}+${sha6}"
            echo "prerelease=${prerelease}"
          } >>"$GITHUB_OUTPUT"
          echo "version=${version}  tag=rstun-v${version}  build=${version}+${sha6}  prerelease=${prerelease}"

      # keyless 证书的 SAN 是「本 workflow 文件 @ 触发时所在的 ref」：
      #   · 从 tag 触发 → `…@refs/tags/rstun-v<version>`（发布说明与文档宣称的就是这个）；
      #   · 从 main 触发 → `…@refs/heads/main` —— `post-release-verify` 按 tag 身份逐字比对，
      #     必然红；而发布说明仍会写 tag 身份 → 「事实性错误的签名声明」。
      # 所以 sign=true 只允许从 tag ref 触发（`release-prep` 就是这么 dispatch 的）。
      # 确实要从分支发版时显式传 `-f sign=false`（说明会写「本版未签名」）。
      - name: Require tag ref when signing
        if: inputs.sign
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/tags/${TAG}" ]; then
            echo "::error::sign=true 必须从 tag ref 触发（当前 ${GITHUB_REF}）：keyless 证书身份会绑到这个 ref"
            echo "::error::请用 gh workflow run release.yml --ref ${TAG} -f version=…；"
            echo "::error::若确实要从分支发版，显式传 -f sign=false（发布说明会写「本版未签名」）"
            exit 1
          fi
          echo "ref=${GITHUB_REF} == refs/tags/${TAG} → 可签名"

  # 四端二进制：两个 linux-musl 在对应架构的 runner 上 native 构建并真跑冒烟；
  # Windows native 跑 `--version`；macOS runner 是 arm64，x86_64 产物只编译（需 Rosetta）。
  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, name: linux-x86_64, smoke: linux }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, name: linux-aarch64, smoke: linux }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows-x86_64, smoke: version }
          - { target: x86_64-apple-darwin, os: macos-latest, name: macos-x86_64, smoke: none }
    runs-on: ${{ matrix.os }}
    env:
      # 版本串编进二进制（`--version` 与响应里的 SOFTWARE 属性都用它），
      # 形态 `<version>+<sha6>`，与镜像作业同串。
      RSTUN_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
      TARGET: ${{ matrix.target }}
      # full 构建的 crypto 后端（ring）含 C 代码；musl 目标要显式指向 musl-gcc，
      # 否则 cc-rs 会去找不存在的 `<triple>-musl-gcc` 并以 exit 101 失败。
      # 两个 runner 都是宿主架构（x86_64 / aarch64），`musl-gcc` 即本机目标。
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # lean 构建只要 Rust；**full** 构建的 ring 含 C 代码，musl 目标需要 musl-gcc。
      # `rustflags: ""` 只清空 RUSTFLAGS 环境变量（本项目没有自定义 rustflags）。
      - name: Install musl C toolchain
        if: runner.os == 'Linux' && contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          musl-gcc --version | head -1

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: 1.95
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}

      # ---- lean 构建（默认发布形态）----
      - name: Build rstun (lean)
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET"
          BIN="target/${TARGET}/release/rstun"
          if [[ "$TARGET" == *windows* ]]; then BIN="${BIN}.exe"; fi
          ls -l "$BIN"

      - name: Self-check lean (--version)
        if: matrix.smoke != 'none'
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/rstun"
          if [[ "$TARGET" == *windows* ]]; then BIN="${BIN}.exe"; fi
          out="$("$BIN" --version)"
          echo "$out"
          # 版本串必须来自 RSTUN_BUILD_VERSION（含 sha6），否则说明注入链路断了
          printf '%s\n' "$out" | grep -qF "${RSTUN_BUILD_VERSION}" \
            || { echo "::error::--version 与 RSTUN_BUILD_VERSION 不一致（期望 ${RSTUN_BUILD_VERSION}）"; exit 1; }

      - name: Binding smoke (UDP + TCP)
        if: matrix.smoke == 'linux'
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/rstun"
          PORT=34780
          "$BIN" server --listen "127.0.0.1:${PORT}" --tcp &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          bash script/ci/rstun-smoke.sh "127.0.0.1:${PORT}" --tcp --retries 10
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      # lean 二进制先落盘：下一步的 full 构建会覆盖 `target/.../release/rstun`。
      - name: Stage lean artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/lean
          BIN="target/${TARGET}/release/rstun"
          if [[ "$TARGET" == *windows* ]]; then BIN="${BIN}.exe"; fi
          cp "$BIN" artifacts/lean/
          ls -l artifacts/lean

      # ---- full 构建（`turns:` + DTLS）----
      # 同一 target 目录再编一次：依赖已就位，只多编 rustls/webrtc-dtls 那一支。
      - name: "Build rstun (full: tls+dtls)"
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" --features full
          BIN="target/${TARGET}/release/rstun"
          if [[ "$TARGET" == *windows* ]]; then BIN="${BIN}.exe"; fi
          ls -l "$BIN"

      # 两种构建的 `--version` 必须同串（版本只来自 Cargo.toml / RSTUN_BUILD_VERSION），
      # 区别只在 feature；用 lean 的检查逻辑再验一次 full，防止注入链路只在一边生效。
      - name: Self-check full (--version)
        if: matrix.smoke != 'none'
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/rstun"
          if [[ "$TARGET" == *windows* ]]; then BIN="${BIN}.exe"; fi
          out="$("$BIN" --version)"
          echo "$out"
          printf '%s\n' "$out" | grep -qF "${RSTUN_BUILD_VERSION}" \
            || { echo "::error::full --version 与 RSTUN_BUILD_VERSION 不一致（期望 ${RSTUN_BUILD_VERSION}）"; exit 1; }

      # full 产物不能只验 `--version`：TLS 正是它多出来的东西。两件事各一个进程：
      #   1) `turns:` 监听 + openssl 自签证书 → 真实 TLS 握手；
      #   2) 同一份 full 二进制在「默认关闭 TURN」形态下仍只做 Binding
      #      （`rstun-smoke.sh` 发的是无凭据请求，开 `--turn` 的实例会正确回 401，
      #        所以这一步必须用一个不鉴权的实例）。
      # 仅 Linux runner（有 openssl）。
      - name: TLS smoke (full build)
        if: matrix.smoke == 'linux'
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/rstun"
          WORK="$(mktemp -d)"
          openssl ecparam -name prime256v1 -genkey -noout -out "$WORK/sec1.pem"
          openssl pkcs8 -topk8 -nocrypt -in "$WORK/sec1.pem" -out "$WORK/key.pem"
          openssl req -new -x509 -key "$WORK/key.pem" -out "$WORK/cert.pem" -days 2 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          # 1) `turns:`：独立实现（openssl）完成 TLS 握手
          "$BIN" server --listen "127.0.0.1:34790" \
            --turn --realm example.org --auth-secret ci-secret \
            --auth-user ci --auth-pass ci \
            --turn-tls-listen "127.0.0.1:34791" \
            --tls-cert "$WORK/cert.pem" --tls-key "$WORK/key.pem" >"$WORK/tls.log" 2>&1 &
          tls_pid=$!
          trap 'kill "$tls_pid" "$plain_pid" 2>/dev/null || true; wait 2>/dev/null || true' EXIT
          plain_pid=""

          # 2) 默认形态（不开 --turn）：Binding 仍按 5389 回答
          "$BIN" server --listen "127.0.0.1:34792" >"$WORK/plain.log" 2>&1 &
          plain_pid=$!
          sleep 1

          # Capture first, grep second: piping a long-running openssl into
          # `grep -q` makes grep exit on the first match, openssl take SIGPIPE,
          # and `pipefail` fail the step even though the handshake succeeded.
          timeout 10 openssl s_client -connect "127.0.0.1:34791" -servername localhost -brief \
            </dev/null >"$WORK/sclient.log" 2>&1
          grep -qa "CONNECTION ESTABLISHED" "$WORK/sclient.log" \
            || { echo "::error::turns: handshake failed"; cat "$WORK/sclient.log"; exit 1; }
          echo "TLS handshake ok"
          bash script/ci/rstun-smoke.sh "127.0.0.1:34792" --retries 10
          echo "full build: plain Binding ok"

          kill "$tls_pid" "$plain_pid" 2>/dev/null || true
          wait "$tls_pid" "$plain_pid" 2>/dev/null || true

      - name: Stage full artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/full
          BIN="target/${TARGET}/release/rstun"
          if [[ "$TARGET" == *windows* ]]; then BIN="${BIN}.exe"; fi
          cp "$BIN" artifacts/full/
          ls -l artifacts/full

      # 资产名统一 **带 `rstun-` 前缀**：lean `rstun-<platform>`、full `rstun-full-<platform>`。
      # release 作业按 `pattern: rstun-*` 拉取后直接改名，所以这里多出的 `full-` 前缀
      # 会自然变成 `rstun-full-<platform>-<version>.zip`。
      - name: Upload lean artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rstun-${{ matrix.name }}
          path: ./artifacts/lean
          if-no-files-found: error
          retention-days: 14

      - name: Upload full artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rstun-full-${{ matrix.name }}
          path: ./artifacts/full
          if-no-files-found: error
          retention-days: 14


  # 双架构镜像：两个 runner 各自 native build（不靠 QEMU 模拟），各推 `<version>-<arch>`，
  # 再由 `manifest` 作业合成 `<version>`。context = 仓库根。
  #
  # 镜像是 **full** 构建（Dockerfile 里 `--features full`）：容器是本服务最常见的部署形态，
  # `turns:` / DTLS 不能要求用户自己重编镜像。代价是镜像里多 ~4 MB（rustls + webrtc-dtls）。
  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write # 推 ghcr.io/<owner>/rstun（仍是 GITHUB_TOKEN）
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build container image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "RSTUN_BUILD_VERSION=${BUILD_VERSION}" \
            --tag "rstun:${VERSION}-${{ matrix.arch }}" \
            .

      - name: Self-check (--version in image)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
        run: |
          set -euo pipefail
          out="$(docker run --rm "rstun:${VERSION}-${{ matrix.arch }}" --version)"
          echo "$out"
          printf '%s\n' "$out" | grep -qF "${BUILD_VERSION}" \
            || { echo "::error::镜像内 --version 与 RSTUN_BUILD_VERSION 不一致（期望 ${BUILD_VERSION}）"; exit 1; }

      - name: Push architecture tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/rstun:${VERSION}-${{ matrix.arch }}"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag "rstun:${VERSION}-${{ matrix.arch }}" "$image"
          docker push "$image"
          echo "pushed ${image}" >>"$GITHUB_STEP_SUMMARY"

  # 合成 `<version>`：`docker manifest create` 把两个架构标签合成一个 manifest list。
  # 稳定版（版本不含 `-`）额外产一份 `latest`。
  manifest:
    name: Manifest
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/rstun"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          tag() {
            local target="$1"
            # `--amend` 让重复 dispatch 幂等（已存在的本地 manifest list 直接覆盖）
            docker manifest create --amend "${repo}:${target}" \
              "${repo}:${VERSION}-amd64" "${repo}:${VERSION}-arm64"
            docker manifest annotate --os linux --arch amd64 "${repo}:${target}" "${repo}:${VERSION}-amd64"
            docker manifest annotate --os linux --arch arm64 "${repo}:${target}" "${repo}:${VERSION}-arm64"
            docker manifest push "${repo}:${target}"
            docker manifest inspect "${repo}:${target}" >/dev/null
            echo "pushed ${repo}:${target}" >>"$GITHUB_STEP_SUMMARY"
          }

          tag "${VERSION}"
          if [ "${PRERELEASE}" = "false" ]; then
            tag latest
          fi

  # 镜像签名（keyless）：签名以 OCI 附件（referrer）存进 registry，**不增加 Release 资产**。
  # 只签 **manifest list digest**（`--recursive` 留给「要逐平台校验」的场景）：下游按 digest 固定
  # 的就是 index，签它才与「我拉到的就是这一份」对齐。
  # 与 `release` 作业并行是安全的：它不碰文件资产。
  sign-image:
    name: Sign container image
    needs: [prepare, manifest]
    if: inputs.sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # 读回本 run 刚推的 manifest list 并推签名附件
      id-token: write # keyless：OIDC → Fulcio 短期证书
    steps:
      - name: Install cosign (keyless)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign manifest list digest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/rstun"
          # cosign 复用 docker 的凭证（`~/.docker/config.json`），不需要额外 secret。
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          # 摘要**从 registry 读回**（而不是拿本地推断值）：签的必须是别人拉得到的那份 index。
          digest="$(docker buildx imagetools inspect "${repo}:${VERSION}" \
            | sed -n 's/^Digest: *\(sha256:[0-9a-f]\{64\}\)$/\1/p' | head -n1)"
          [ -n "$digest" ] || { echo "::error::没拿到 ${repo}:${VERSION} 的 manifest list digest"; exit 1; }
          echo "signing ${repo}@${digest}"
          cosign sign --yes "${repo}@${digest}"
          echo "- 镜像签名：\`${repo}@${digest}\`" >>"$GITHUB_STEP_SUMMARY"

  # SBOM：lean / full 各一份 CycloneDX（`cargo metadata` 生成，不需要额外工具链）。
  # 与平台无关，只跑一次；`gen-sbom.sh` 会断言**直接依赖数**（lean 10 / full 15；Windows full 14）——
  # 依赖面一变就红，避免 SBOM 与「依赖面」文档各说各话。
  sbom:
    name: SBOM (${{ matrix.features }})
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: [lean, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: 1.95
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sbom-${{ runner.os }}-${{ runner.arch }}

      # `--locked` + 依赖闭包 BFS：读不到新依赖也不会「猜」进 SBOM。
      - name: Generate CycloneDX (${{ matrix.features }})
        run: |
          set -euo pipefail
          bash script/ci/gen-sbom.sh \
            --features "${{ matrix.features }}" \
            --out "dist/sbom/rstun-${{ needs.prepare.outputs.version }}-${{ matrix.features }}.cdx.json"

      # 名字**不带** `rstun-` 前缀：release 作业按 `pattern: rstun-*` 拉二进制，
      # 混进来会被当成一个「平台目录」并破坏 8 个 zip 的断言。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ matrix.features }}
          path: dist/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Release：`rstun-v<version>` + 八份二进制（四端 × lean/full）+ 两份 SBOM + Homebrew formula 模板。
  # 幂等：已存在则只覆盖资产，不改标题/说明（避免把人工补充的 release notes 冲掉）。
  release:
    name: Publish Release
    needs: [prepare, build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # 建/更新 Release 并上传资产
      id-token: write # keyless 签名：OIDC → Fulcio 短期证书（cosign sign-blob）
    steps:
      # `gh release create` 需要 git 仓库来解析/创建 tag（无 checkout 会
      # `fatal: not a git repository`）。二进制走 artifact 传递。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release_assets
          pattern: rstun-*

      # SBOM 走单独的 artifact 名（`sbom-lean` / `sbom-full`），`merge-multiple` 摊平目录。
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: sbom_assets
          pattern: sbom-*
          merge-multiple: true

      # Debian 包只发 **lean**（与 brew 一致的既有决定）。在这里（x86_64 runner）统一打两个架构：
      # nfpm 只是打包器、与宿主架构无关，二进制直接取 build 作业 staged 的 lean 产物；
      # arm64 包无法在本机执行版本自检，用 `--foreign-bin` 跳过（来源由 zip/asset 保证）。
      - name: Build Debian packages (lean)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p deb_assets
          for pair in amd64:rstun-linux-x86_64 arm64:rstun-linux-aarch64; do
            arch="${pair%%:*}"
            dir="${pair##*:}"
            bin="release_assets/${dir}/rstun"
            [ -f "$bin" ] || { echo "::error::missing lean binary $bin"; exit 1; }
            # `download-artifact` 不保留权限位（GitHub 已知行为）：落盘是 0644，
            # 直接 `[ -x ]` 会误判成「缺文件」，打包前补回可执行位。
            chmod +x "$bin"
            extra=()
            [ "$arch" = arm64 ] && extra=(--foreign-bin)
            bash script/ci/build-deb.sh --download-nfpm "${extra[@]}" \
              --version "$VERSION" --arch "$arch" --bin "$bin" --out deb_assets
          done
          ls -l deb_assets

      - name: Package assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p zipped_assets
          shopt -s nullglob
          count=0
          for d in release_assets/rstun-*; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            name="${name#rstun-}"
            # `upload-artifact` / `download-artifact` 不保留文件权限位（GitHub 的已知行为），
            # 直接打包会得到 0644 的二进制 —— 用户解压后 `./rstun` 报「权限不够」。
            # 打包前补回可执行位（Windows 的 .exe 也照做，跨平台解压时更省心）。
            for f in "$d"/*; do
              [ -f "$f" ] && chmod +x "$f"
            done
            ( cd "$d" && zip -r "../../zipped_assets/rstun-${name}-${VERSION}.zip" . )
            count=$((count + 1))
          done
          # 4 个平台 × 2 种构建 = 8 个资产；少一个都说明 build 矩阵断了一条腿。
          if [ "$count" -ne 8 ]; then
            echo "::error::期望 8 个资产（4 平台 × lean/full），实际 ${count} 个 —— 拒绝发不完整的 Release"
            exit 1
          fi
          echo "打包 ${count} 个资产（lean + full）"
          ls -l zipped_assets

      # SBOM 与 Homebrew formula 是「顺手产物」：缺了说明 sbom 作业或 zipped_assets 有问题，
      # 但**不**影响 8 个 zip 的断言（那份断言只数 zip）。
      - name: Collect SBOMs and Homebrew formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(sbom_assets/*.cdx.json)
          if [ "${#sboms[@]}" -ne 2 ]; then
            echo "::error::期望 2 份 SBOM（lean + full），实际 ${#sboms[@]} 份"
            exit 1
          fi
          ls -l "${sboms[@]}"
          bash script/ci/gen-brew.sh --assets zipped_assets --version "$VERSION" --out dist/homebrew
          ls -l dist/homebrew

      - name: Render release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGN: ${{ inputs.sign }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "独立 STUN 服务器 \`rstun\`（RFC 5389 Binding；RFC 5780 需 \`--alt-listen\`）。"
            echo ""
            # 预发布必须**在说明里**就说清：它不会被标成 latest，也不该拿去生产。
            if [ "${PRERELEASE}" = "true" ]; then
              echo "> **预发布版本**（\`${VERSION}\`，版本号含 \`-\`）：用于验证发布流程/新特性，**不建议生产使用**；"
              echo "> 它不会被标为 latest（\`releases/latest\` 与 Homebrew tap 仍指向最近一个正式版）。"
              echo ""
            fi
            echo "| 平台 | lean（默认） | full（+ \`turns:\` + DTLS） |"
            echo "| --- | --- | --- |"
            echo "| Linux x86_64 | \`rstun-linux-x86_64-${VERSION}.zip\` | \`rstun-full-linux-x86_64-${VERSION}.zip\` |"
            echo "| Linux aarch64 | \`rstun-linux-aarch64-${VERSION}.zip\` | \`rstun-full-linux-aarch64-${VERSION}.zip\` |"
            echo "| macOS x86_64 | \`rstun-macos-x86_64-${VERSION}.zip\` | \`rstun-full-macos-x86_64-${VERSION}.zip\` |"
            echo "| Windows x86_64 | \`rstun-windows-x86_64-${VERSION}.zip\` | \`rstun-full-windows-x86_64-${VERSION}.zip\` |"
            echo ""
            echo "\`lean\`：STUN + TURN(UDP/TCP) + REST 临时凭据 + 带宽配额（10 个直接依赖，Windows 9；release 未 strip 3.93 MB）。"
            echo "\`full\`：再加 \`turns:\`(TLS) 与 DTLS 1.2（15 个直接依赖，Windows 14；release 未 strip 8.16 MB）。"
            echo "不带这两个 flag 时两者行为完全一致；\`--turn-tls-listen\` 在 lean 上会明确拒绝启动。"
            echo ""
            echo "容器镜像：\`ghcr.io/${owner}/rstun:${VERSION}\`（linux/amd64 + linux/arm64，**full** 构建；"
            echo "版本不含 \`-\` 时另有 \`latest\`）。"
            echo ""
            echo "SBOM（CycloneDX 1.5，\`cargo metadata\` 生成）："
            echo "\`rstun-${VERSION}-lean.cdx.json\` / \`rstun-${VERSION}-full.cdx.json\`。"
            echo "Homebrew：\`brew install exvlan/rstun/rstun\`（tap；同一份 formula 也在本 Release 的 \`rstun.rb\` 里）。"
            echo "Debian/Ubuntu：\`rstun_${VERSION}_amd64.deb\` / \`rstun_${VERSION}_arm64.deb\`"
            echo "（lean，musl static-pie；\`sudo dpkg -i rstun_${VERSION}_amd64.deb\`）。"
            if [ "${SIGN}" = "true" ]; then
              echo "**已用 cosign keyless 签名**（GitHub OIDC + Sigstore Fulcio/Rekor）："
              echo "\`SHA256SUMS\`（覆盖上述 13 个资产）+ \`SHA256SUMS.bundle\` + 两份 SBOM 的 \`.bundle\`；"
              echo "容器镜像按 **manifest list digest** 签名（OCI 附件）。证书身份绑定到"
              echo "\`exvlan/rstun\` 的 \`release.yml\` **@refs/tags/rstun-v${VERSION}\`**，验证命令见"
              echo "README 的「验证产物」节（\`docs/book/src/verify.md\`）。"
            else
              echo "**本版未签名**（dispatch 时 \`sign=false\`）：只能自行计算 sha256 与 SBOM 对照，"
              echo "或在信任前从 tag 自行构建。"
            fi
            echo ""
            echo "跑起来：\`rstun server --listen 0.0.0.0:3478\`（UDP；加 \`--tcp\` 同时答 TCP）。"
          } > release_notes.md
          cat release_notes.md

      # ---- 签名（keyless）---------------------------------------------------
      # 三个前提，缺一个都会让「已签名」变成空话：
      #   1) `SHA256SUMS` 必须基于**最终上传的字节** —— 所以先复制到扁平目录，之后不再改动；
      #   2) bundle 由 cosign 写入（签名 + 证书 + Rekor 证明），与清单文件同名 + `.bundle`；
      #   3) 失败即发布失败（Fulcio/Rekor 不可达时报可读错误，不发半套「声称已签名」的资产）。
      - name: Stage assets for checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf signed_assets
          mkdir -p signed_assets
          cp zipped_assets/*.zip sbom_assets/*.cdx.json dist/homebrew/*.rb deb_assets/*.deb signed_assets/
          # 文件名里**不能有 `~`**：GitHub Release 会把资产名的 `~` 改写成 `.`（2026-11-23 dev 演练
          # 实测：nfpm 的 `rstun_<ver>~dev.0_amd64.deb` 上传后变成 `rstun_<ver>.dev.0_amd64.deb`），
          # 而 `SHA256SUMS` 是按本地文件名算的 → 用户下载后 `sha256sum -c` 全红。
          # build-deb.sh 已把 deb 文件名规范化成 `-`；这里再守一道，防止别处漏出 `~`。
          # 用赋值而不是 `| grep -q`：目录不存在时 find 的非 0 要能失败（管道会把它吞掉）。
          tilde_files="$(find signed_assets -maxdepth 1 -type f -name '*~*' -print)"
          if [ -n "$tilde_files" ]; then
            echo "::error::暂存目录里有含 \`~\` 的文件名（GitHub 会把它改写成 \`.\`，哈希清单将对不上）"
            printf '  %s\n' "$tilde_files"
            ls -l signed_assets
            exit 1
          fi
          # 8 zip + 2 SBOM + 1 formula + 2 deb = 13
          count="$(find signed_assets -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 13 ]; then
            echo "::error::待签名目录里应有 13 个文件，实际 ${count}"
            ls -l signed_assets
            exit 1
          fi
          ls -l signed_assets

      # 版本固定、action 锁 40 位 SHA：验证口径与 cosign 版本绑定（换版本 = 换 spec）。
      - name: Install cosign (keyless)
        if: inputs.sign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Generate SHA256SUMS
        if: inputs.sign
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd signed_assets
          # **裸文件名** + 按文件名稳定排序：用户在同一个下载目录里 `sha256sum -c SHA256SUMS` 即可
          # （不写路径，免得换个目录就整份失效）。
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c --strict SHA256SUMS
          echo "13 个资产的哈希已写入 SHA256SUMS"

      - name: Sign SHA256SUMS and SBOMs (keyless)
        if: inputs.sign
        working-directory: signed_assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # 签「全部资产的哈希清单」+「依赖声明」：前者让 10 个二进制/包各只需一次间接验证，
          # 后者是「产物里装了什么」的独立声明。签名数 3，验证成本最低。
          targets=(
            "SHA256SUMS"
            "rstun-${VERSION}-lean.cdx.json"
            "rstun-${VERSION}-full.cdx.json"
          )
          for f in "${targets[@]}"; do
            [ -f "$f" ] || { echo "::error::待签文件不存在：$f"; exit 1; }
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done
          ls -l ./*.bundle
          # bundle 必须是「签名 + 证书 + Rekor 证明」的单文件；缺一个也不该发出去。
          for f in "${targets[@]}"; do
            [ -s "${f}.bundle" ] || { echo "::error::bundle 为空：${f}.bundle"; exit 1; }
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGN: ${{ inputs.sign }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 13 个核心资产（8 zip + 2 SBOM + formula + 2 deb）恒存在；签名时再加
          # `SHA256SUMS` + 3 个 `.bundle` = **17**。数量期望按 `sign` 分支写，不写死一个数。
          assets=(signed_assets/*)
          zips=(signed_assets/*.zip)
          debs=(signed_assets/*.deb)
          expected=13
          if [ "${SIGN}" = "true" ]; then expected=17; fi
          if [ "${#zips[@]}" -ne 8 ] || [ "${#debs[@]}" -ne 2 ] || [ "${#assets[@]}" -ne "$expected" ]; then
            echo "::error::资产数不对（sign=${SIGN}）：zip ${#zips[@]}（期望 8）+ deb ${#debs[@]}（期望 2）+ 其它 $(( ${#assets[@]} - ${#zips[@]} - ${#debs[@]} ))，合计 ${#assets[@]}（期望 ${expected}）"
            printf '  %s\n' "${assets[@]}"
            exit 1
          fi
          if [ "${SIGN}" = "true" ]; then
            for want in \
              "SHA256SUMS" \
              "SHA256SUMS.bundle" \
              "rstun-${VERSION}-lean.cdx.json.bundle" \
              "rstun-${VERSION}-full.cdx.json.bundle"; do
              [ -f "signed_assets/${want}" ] || { echo "::error::缺少签名资产 ${want}"; exit 1; }
            done
            ( cd signed_assets && sha256sum -c --strict SHA256SUMS )
          fi
          ls -l "${assets[@]}"
          # 预发布（版本号含 `-`）必须标 `--prerelease`：否则 GitHub 会把它算作「最新正式版」，
          # `/releases/latest` 随之指向 dev —— tap 的 `sync.yml` 读的就是 latest，会把
          # Homebrew formula 切到预发布（2026-11-23 dev 演练实测踩到）。
          # 两个分支都要设置：`--clobber` 重跑不会改既有 Release 的 prerelease 标志，必须显式 edit。
          create_args=()
          if [ "${PRERELEASE}" = "true" ]; then
            create_args+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 只覆盖资产（--clobber，幂等；不动标题与说明）"
            gh release upload "$TAG" "${assets[@]}" --clobber
            # 幂等校正状态：正式版传 `--prerelease=false`（顺手修掉历史上误标为预发布的稳定版）。
            gh release edit "$TAG" "--prerelease=${PRERELEASE}"
            echo "Release $TAG 的 prerelease=${PRERELEASE}"
          else
            echo "创建 Release $TAG（prerelease=${PRERELEASE}）"
            gh release create "$TAG" "${assets[@]}" \
              --title "rstun ${VERSION}" --notes-file release_notes.md \
              "${create_args[@]}"
          fi

      - name: Summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SIGN: ${{ inputs.sign }}
        run: |
          {
            echo "### Release"
            echo ""
            echo "- Release: \`${TAG}\`"
            if [ "${SIGN}" = "true" ]; then
              echo "- 签名: cosign keyless（17 个资产 = 13 + \`SHA256SUMS\` + 3 个 \`.bundle\`）；镜像由 \`sign-image\` 签 digest"
            else
              echo "- 签名: **未签名**（\`sign=false\` 应急路径）"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # crates.io 自动发布（P1）：与 `release` 作业**并行**，互不阻塞 ——
  #   * 不 `needs: release`：crate 发布失败不该拦住 17 个资产的发布；
  #   * 但 `needs: [prepare, build]`：先确认版本合法且四端都编出来了再花掉一次不可撤回的发布；
  #   * 逻辑全在可复用件里（幂等 API 检查 + token 守卫 + `cargo publish --locked`），
  #     演练走它的 `workflow_dispatch`，**不要**为了重试 publish 而重跑整个 release
  #     （那会重建镜像 → 同一版本的 manifest digest 变化）。
  #
  # 调用方可复用 workflow 时必须**显式**传 secrets（不会自动继承仓库 secret）；
  # 作业级 `permissions` 也只能收窄、不能超过 workflow 级默认。
  publish-crates:
    name: Publish to crates.io
    needs: [prepare, build]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-crates.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
