name: Release preflight

# 发版前的**只读**总预检：把「发版当天才发现某一项坏了」提前到一次手动 dispatch。
#
# 为什么要单独一个 workflow：
#   * 这里跑的东西（42 项互操作 / TURN lean+full / frozen 字节冻结 / SBOM / deb /
#     打包 dry-run）各自要几分钟，全塞进 `ci.yml` 会把每次 PR 的反馈时间拖到不可接受；
#   * 但发版前必须全绿 —— 所以做成 dispatch，跑完在 step summary 里给出「可以发版 /
#     卡在哪一步」。
#
# 只读承诺：不建 tag、不建 Release、不 push、不 publish（`cargo publish --dry-run`
# 只打包并本地编译，不联网发布）。`permissions` 因此只有 `contents: read`。
#
# 用法：Actions → Release preflight → Run workflow，version 填**不带 v** 的版本号
# （必须等于 Cargo.toml 的 version，例如 26.410.104）。
#
# 退出语义：版本钉死点/单测/clippy/fmt 是「快且必须」的门，失败立即停；
# 后面的 lab / SBOM / 打包段即使某项失败也继续跑完（一次 dispatch 看到全部问题），
# 最后由 Summary 作业统一判定 —— 任一非 success 即整个 workflow 红。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，必须等于 Cargo.toml 的 version）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # 不在这里定义 VERSION：只由 Normalize 步骤写入 `$GITHUB_ENV`，后续步骤统一从那里读，
  # 避免「workflow 级 env 与 GITHUB_ENV 谁优先」的歧义（输入可能带 v）。

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: preflight (${{ inputs.version }})
    runs-on: ubuntu-24.04
    # 一次完整跑（42 项互操作 + TURN lean/full + frozen 双构建 + deb）在本机约 30–50 分钟，
    # 公共 runner 更慢；90 分钟是「跑不完说明环境卡住」的上界，不是常规耗时。
    timeout-minutes: 90
    steps:
      # frozen 项用 `git archive <FROZEN_BASE>` 导出基线源码，必须能解析历史提交。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 与 release.yml 的 prepare 同语义：误带 `v` 前缀也接受，后续统一用不带 v 的版本串。
      # 输入只经 step env 传进来，之后所有步骤统一读 `$GITHUB_ENV` 的 VERSION（单一来源）。
      - name: Normalize version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          echo "VERSION=${version}" >>"$GITHUB_ENV"
          echo "version=${version}（不含 v）"

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: 1.95
          components: rustfmt,clippy
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: preflight-${{ runner.os }}-${{ runner.arch }}

      # ---- 段 1：版本钉死点（最快、失败最常见的门）------------------------------
      - name: Check version pins
        id: pins
        run: bash script/ci/check-version-pins.sh --version "$VERSION"

      # ---- 段 2：单测 / clippy / fmt -----------------------------------------
      # 两种 feature 组合各跑一次（lean 是发布形态，full 覆盖 TLS/DTLS 代码路径）。
      - name: Gates (tests + clippy + fmt)
        id: gates
        run: |
          set -euo pipefail
          cargo test --no-fail-fast --no-default-features
          cargo test --no-fail-fast --all-features
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo fmt --all -- --check

      # ---- 段 3：lab（互操作 / TURN lean / TURN full）--------------------------
      # interop 的对手是外部实现：coturn（turnserver + turnutils_*）与 go（pion）。
      # 与 `qa-scheduled` 相同的口径：缺依赖会记 BLOCKED/SKIP —— 这里**断言没有
      # 白名单之外的 SKIP**，否则 preflight 会在没真跑的情况下假绿。
      #
      # go 必须用 setup-go 装，**不能**用 apt 的 `golang-go`：
      #   * Ubuntu 24.04 的 golang-go 是 1.22.2，而 `github.com/pion/stun/v3` 的
      #     go.mod 要求 `go 1.24.0` → 旧 go 会触发 **toolchain 自动下载**，
      #     CI 上该下载失败，表现为 `pion-build.log` 里构建失败（run 45020548183）；
      #   * 同时把 apt 的 golang-go 从安装列表里去掉：它会把 `/usr/bin/go`（1.22）
      #     留在系统 PATH 里，一旦某个 shell 解析到它，就又会触发 toolchain 下载
      #     —— 版本错配必须只有一种来源。
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install lab dependencies (coturn + python3 + iproute2)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            coturn python3 iproute2
          # pion v3 的 go.mod 要求 go 1.24.0；低于它会触发 toolchain 下载（CI 上必败）。
          # 这里显式断言，避免「解析到系统的旧 go」再次静默降级。
          go_version="$(go version | awk '{print $3}')"
          if [ "$(printf '%s\ngo1.24\n' "$go_version" | sort -V | head -1)" != go1.24 ]; then
            echo "::error::interop 需要 go >= 1.24（pion v3 的 go.mod），实际 $go_version"
            exit 1
          fi
          go version
          turnserver --version 2>&1 | head -1 || true

      - name: Interop matrix (all)
        id: interop
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          log="$RUNNER_TEMP/interop.log"
          bash script/lab/rstun-interop.sh all >"$log" 2>&1 || status=$?
          tail -80 "$log" || true
          # 只白名单 IPv6（runner 不保证 ::1）；其它 SKIP 都是依赖没装齐 → 失败。
          unexpected="$(grep '^  SKIP ' "$log" \
            | grep -vE '^  SKIP (probe/ipv6|webrtc-stun/ipv6)( |$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::interop 出现了白名单之外的 SKIP（依赖没装齐）："
            printf '%s\n' "$unexpected"
            status=1
          fi
          # 脚本的 stdout 只写一行 `FAIL pion 构建失败（<path>）`，真正的原因是它自己
          # 落的构建日志（`$LOG_DIR/pion-build.log` 等）。失败时把 `*build*.log` 的尾部
          # 打到 stdout，否则每次都要人工去 `/tmp/opencode/rstun-interop/logs` 翻。
          # 找不到日志就跳过 —— 诊断不改变退出状态。
          if [ "$status" -ne 0 ]; then
            logdir="${RSTUN_INTEROP_DIR:-/tmp/opencode/rstun-interop}/logs"
            for f in "$logdir"/*build*.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f") (tail -40)"
              tail -40 "$f" || true
              echo "::endgroup::"
            done
          fi
          exit "$status"

      # lean：TURN UDP/TCP + REST + 配额 + frozen（字节冻结）。
      - name: TURN acceptance (lean)
        id: turn_lean
        continue-on-error: true
        run: bash script/lab/rstun-turn.sh

      # full：`--tls --dtls` 会自动 `cargo build --features full` 并跑 TLS/DTLS 项。
      - name: "TURN acceptance (full: --tls --dtls)"
        id: turn_full
        continue-on-error: true
        run: bash script/lab/rstun-turn.sh --tls --dtls

      # ---- 段 4：SBOM --------------------------------------------------------
      - name: SBOM (lean + full)
        id: sbom
        continue-on-error: true
        run: |
          set -euo pipefail
          out=/tmp/preflight-sbom
          mkdir -p "$out"
          bash script/ci/gen-sbom.sh --features lean --out "$out/rstun-${VERSION}-lean.cdx.json"
          bash script/ci/gen-sbom.sh --features full --out "$out/rstun-${VERSION}-full.cdx.json"
          ls -l "$out"

      # ---- 段 5：打包（deb 真实打包 + brew 渲染 + publish dry-run）------------
      # 注意：这里的 `cargo build --release` 是**宿主 glibc** 构建。本段只验：
      #   nfpm 版本/架构元数据、安装路径（/usr/local/bin/rstun）、unit 与打包脚本能跑通；
      # **不验** musl / static-pie / 目标架构 —— 那道门在 `release.yml` 的
      # `--target <triple>-unknown-linux-musl` 构建里。要在这里也验 musl，需要装
      # `musl-tools` 再整编一遍依赖（几分钟），preflight 已经很长，暂不重复。
      - name: Build release binary (lean) and Debian package (amd64)
        id: deb
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --release
          bash script/ci/build-deb.sh --download-nfpm --arch amd64 \
            --version "$VERSION" --bin target/release/rstun --out /tmp/preflight-deb
          ls -l /tmp/preflight-deb

      # gen-brew 只做版本/占位符替换 + `ruby -c`；真实 sha256 要等 Release 资产存在，
      # 所以这里用空文件占位（脚本只对它们做 sha256sum，不检查 zip 内容）。
      - name: Render Homebrew formula (placeholder sha256)
        id: brew
        continue-on-error: true
        run: |
          set -euo pipefail
          assets=/tmp/preflight-brew-assets
          mkdir -p "$assets"
          for platform in linux-x86_64 linux-aarch64 macos-x86_64; do
            : >"$assets/rstun-${platform}-${VERSION}.zip"
          done
          bash script/ci/gen-brew.sh --assets "$assets" --version "$VERSION" --out /tmp/preflight-homebrew
          sed -n '/^class Rstun/,$p' /tmp/preflight-homebrew/rstun.rb | head -20

      - name: cargo publish --dry-run
        id: publish
        continue-on-error: true
        run: cargo publish --dry-run

      # ---- 段 6：结论 --------------------------------------------------------
      # 逐段读数来自各 step 的 outcome：`skipped`（上游失败）与 `failure` 都算不通过，
      # 只有全 `success` 才允许发版。最后一条 `[ ... ]` 决定整个 job 的红/绿。
      - name: Summary
        if: always()
        env:
          PINS: ${{ steps.pins.outcome || 'skipped' }}
          GATES: ${{ steps.gates.outcome || 'skipped' }}
          INTEROP: ${{ steps.interop.outcome || 'skipped' }}
          TURN_LEAN: ${{ steps.turn_lean.outcome || 'skipped' }}
          TURN_FULL: ${{ steps.turn_full.outcome || 'skipped' }}
          SBOM: ${{ steps.sbom.outcome || 'skipped' }}
          DEB: ${{ steps.deb.outcome || 'skipped' }}
          BREW: ${{ steps.brew.outcome || 'skipped' }}
          PUBLISH: ${{ steps.publish.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          verdict=PASS
          for outcome in "$PINS" "$GATES" "$INTEROP" "$TURN_LEAN" "$TURN_FULL" \
            "$SBOM" "$DEB" "$BREW" "$PUBLISH"; do
            [ "$outcome" = success ] || verdict=FAIL
          done
          {
            echo "## Release preflight —— \`${VERSION}\`"
            echo ""
            echo "| 段 | 项 | 状态 |"
            echo "| --- | --- | --- |"
            echo "| 1. 版本钉死点 | check-version-pins | ${PINS} |"
            echo "| 2. 门禁 | tests(lean/full) + clippy(lean/full) + fmt | ${GATES} |"
            echo "| 3. labs | interop all | ${INTEROP} |"
            echo "| 3. labs | TURN lean（含 frozen） | ${TURN_LEAN} |"
            echo "| 3. labs | TURN full（--tls --dtls） | ${TURN_FULL} |"
            echo "| 4. SBOM | lean + full | ${SBOM} |"
            echo "| 5. 打包 | deb amd64 | ${DEB} |"
            echo "| 5. 打包 | Homebrew formula 渲染 | ${BREW} |"
            echo "| 5. 打包 | cargo publish --dry-run | ${PUBLISH} |"
            echo "| **6. 结论** | **可以发版 / 卡在哪一步** | **${verdict}** |"
            echo ""
            if [ "$verdict" = PASS ]; then
              echo "下一步：dispatch \`release.yml\`（version=\`${VERSION}\`），或先手工同步版本钉死点后发版。"
            else
              echo "发版被阻断：先修上面状态不是 \`success\` 的段，再重跑 preflight。"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != PASS ]; then
            echo "::error::preflight 未通过（见 step summary 的逐段状态）"
            exit 1
          fi
