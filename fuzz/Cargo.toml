# `rstun` 的解析路径 fuzz 工程（`cargo fuzz`）。
#
# 为什么放在 crate 内的子目录、又声明空 `[workspace]`：
#   · fuzz 目标需要 `libfuzzer-sys`（nightly + 链接 libFuzzer），不能进主 workspace
#     的依赖图（否则普通 `cargo test` / `cargo build` 也会被 nightly 工具链绑架）；
#   · 空 `[workspace]` 让它成为独立 workspace，`cargo metadata` 不会把
#     `rstun` 的 workspace 解析扯进来。
#
# 运行（10 分钟，互操作矩阵的验收口径）：
#   cd fuzz && cargo +nightly fuzz run parse -- -max_total_time=600
#
# 驱动整套互操作矩阵的脚本未随本仓发布：结论与原始证据见 `docs/interop-matrix.md`。
[package]
name = "rstun-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
